<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#245300">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="images/icon-192.png">
    <title>FoundU - Item Details</title>
    <!-- Google Font -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/chat.css">
</head>

<body>
    <!-- Navigation -->
    <header>
        <nav class="navbar">
            <a href="dashboard.html" class="logo">
                FoundU
            </a>

            <div class="nav-links">

                <a href="dashboard.html" data-i18n="home">
                    Home
                </a>

                <a href="search.html" data-i18n="search">
                    Search
                </a>

                <a href="my-reports.html" data-i18n="myReportsTitle">
                    My Reports
                </a>

                <a href="profile.html" data-i18n="profile">
                    Profile
                </a>

            </div>
        </nav>
    </header>

    <!-- Main -->
    <main class="item-details-page">
        <!-- Back -->
        <a href="search.html" class="back-link">
            <span data-i18n="backToSearch">Back to Search</span> 
        </a>

        <!-- Message -->
        <p id="details-message" class="form-message"></p>

        <!-- Item Details -->
        <section class="item-details">

            <!-- Image -->

            <div class="details-image">
                <div class="details-image-placeholder" data-i18n="loading">
                    Loading...
                </div>
            </div>


            <!-- Information -->

            <div class="details-content">

                <p data-i18n="loadingItemDetails">
                    Loading item details...
                </p>

            </div>

        </section>
    </main>

    
<!-- ========================================
     CONTACT REPORTER MODAL
======================================== -->

<div id="contact-modal" class="contact-modal">

    <div class="contact-modal-content">

        <!-- Modal Header -->
        <div class="contact-modal-header">
            <h2 data-i18n="chatWithReporter">
                Contact Reporter
            </h2>

            <button
                type="button"
                id="close-contact-modal"
                class="contact-modal-close"
                aria-label="Close"
            >
                &times;
            </button>
        </div>

        <!-- Message -->
        <div class="contact-modal-body">

            <p
                id="contact-reporter-name"
                class="contact-reporter-name"
            ></p>

            <textarea
                id="contact-message"
                rows="5"
                placeholder="Write your message..."
                data-i18n-placeholder="writeMessage"
            ></textarea>

            <p
                id="contact-modal-message"
                class="form-message"
            ></p>

        </div>

        <!-- Modal Footer -->
        <div class="contact-modal-footer">

            <button
                type="button"
                id="cancel-contact"
                class="btn secondary-btn"
            >
                Cancel
            </button>

            <button
                type="button"
                id="send-message"
                class="btn primary-btn"
            >
                Send Message
            </button>

        </div>

    </div>

</div>


    <!-- Mobile Navigation -->

    <nav class="bottom-nav">
        <a href="dashboard.html" data-i18n="home">
            Home
        </a>

        <a href="search.html" class="active" data-i18n="search">
            Search
        </a>

        <a href="my-reports.html" data-i18n="myReportsTitle">
            Reports
        </a>
        <a href="chats.html" data-i18n="messages">
            Messages
        </a>


        <a href="profile.html" data-i18n="profile">
            Profile
        </a>
    </nav>

    <script src="js/scripts.js"></script>
    <script type="module" src="js/item-details.js"></script>
    <script src="js/language.js"></script>
    <script src="js/pwa.js"></script>
</body>

</html>
