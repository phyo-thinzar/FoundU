<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#245300">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="images/icon-192.png">

    <title>Report Lost Item - Found You</title>


    <!-- Google Font -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">


    <!-- CSS -->
<style>
    /* Back Button */
        .back-button-container {
            width: 100%;
            margin-bottom: 20px;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            border: 1px solid #dbeafe;
            border-radius: 8px;
            background: #ffffff;
            color: #245300;
            font-family: "Poppins", sans-serif;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            transition: 0.2s ease;
        }

        .back-button:hover {
            background: #245300;
            color: #ffffff;
            transform: translateX(-2px);
        }
</style>
    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="css/components.css">

    <link rel="stylesheet" href="css/responsive.css">

</head>


<body>


    <!-- Navigation -->

    <header>

        <nav class="navbar">

            <a href="dashboard.html" class="logo">

                Found You

            </a>


            <div class="nav-links">

                <a href="dashboard.html" data-i18n="home">
                    Home
                </a>

                <a href="search.html" data-i18n="search">
                    Search
                </a>

                <a href="my-reports.html" data-i18n="myReportsTitle">
                    My Reports
                </a>

                <a href="profile.html" data-i18n="profile">
                    Profile
                </a>

            </div>

        </nav>

    </header>


    <!-- Main -->

    <main class="report-page">


       <!--Back button-->
            <div class="back-button-container">
            <button type="button" class="back-button" onclick="history.back()">
                ← <span data-i18n="back">Back</span>
            </button>


        <!-- Header -->

        <section class="page-header">

            <p class="hero-label">

                Campus Lost & Found

            </p>

            <h1 data-i18n="reportLostItem">

                Report Lost Item

            </h1>

            <p data-i18n="lostItemDescription">

                Tell us about the item you lost.

            </p>

        </section>


        <!-- Form -->

        <form id="report-lost-form" class="report-form">


            <!-- Item Name -->

            <div class="form-group">

                <label for="item-name" data-i18n="itemName">

                    Item Name

                </label>

                <input type="text"
                 id="item-name"
                 name="item-name"
                 data-i18n-placeholder="exampleWallet"
                  placeholder="Example : Black Wallet"
                   required>

            </div>


            <!-- Category -->

            <div class="form-group">

                <label for="category" data-i18n="category">

                    Category

                </label>

                <select id="category" name="category" required>

                    <option value="">

                        Select a category

                    </option>

                    <option value="Electronics" data-i18n="electronics">

                        Electronics

                    </option>

                    <option value="Wallets" data-i18n="wallet">

                        Wallets

                    </option>

                    <option value="Keys" data-i18n="keys">

                        Keys

                    </option>

                    <option value="Documents" data-i18n="documents">

                        Documents

                    </option>

                    <option value="Accessories" data-i18n="accessories">

                        Accessories

                    </option>

                    <option value="Other" data-i18n="other">

                        Other

                    </option>

                </select>

            </div>


            <!-- Description -->

            <div class="form-group">

                <label for="description" data-i18n="description">

                    Description

                </label>

                <textarea 
                id="description" 
                name="description" 
                rows="5"
                   data-i18n-placeholder="describeItem" 
                placeholder="Describe the item, color, brand, or other details..." required></textarea>

            </div>


            <!-- Location -->

            <div class="form-group">

                <label for="location" data-i18n="whereLost">

                    Where did you lose it?

                </label>

                <select id="location" name="location" required>

                    <option value="" data-i18n="selectLocation">

                        Select a location

                    </option>

                    <option value="Library">Library</option>
                    <option value="Cafeteria">Cafeteria</option>
                    <option value="Building A">Building A</option>
                    <option value="Building B">Building B</option>
                    <option value="Parking Area">Parking Area</option>
                    <option value="Other" data-i18n="other">Other</option>
                </select>

            </div>


            <!-- Date -->

            <div class="form-group">

                <label for="lost-date" data-i18n="lostDate">

                    Date Lost

                </label>

                <input type="date" id="lost-date" name="lost-date" required>

            </div>


            <!-- Photo -->

            <div class="form-group">

                <label for="item-photo" data-i18n="itemPhoto">

                    Item Photo

                </label>

                <input type="file" id="item-photo" name="item-photo" accept="image/*">

                <small class="form-help" data-i18n="photoHelp">

                    Upload a clear photo of the item if available.

                </small>

            </div>


            <!-- Message -->

            <p id="form-message" class="form-message">
            </p>


            <!-- Submit -->

            <button type="submit" class="btn primary-btn report-submit" data-i18n="reportLostItem">

                Report Lost Item

            </button>


        </form>

    </main>


    <!-- Mobile Navigation -->

    <nav class="bottom-nav">

        <a href="dashboard.html" data-i18n="home">

            Home

        </a>

        <a href="search.html" data-i18n="search">

            Search

        </a>

        <a href="my-reports.html" class="active">

            Reports

        </a>

        <a href="profile.html" data-i18n="profile">

            Profile

        </a>

    </nav>


    <!-- JavaScript -->

    <script src="js/scripts.js"></script>

    <script type="module" src="js/report-lost.js">
    </script>


    <script src="js/language.js"></script>
    <script src="js/pwa.js"></script>
</body>

</html>
