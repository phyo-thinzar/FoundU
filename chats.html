<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages - FoundU</title>

    <!--CSS-->
    <style>
        /* Back Button */
        .back-button-container {
            width: 100%;
            margin-bottom: 20px;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            border: 1px solid #dbeafe;
            border-radius: 8px;
            background: #ffffff;
            color: #245300;
            font-family: "Poppins", sans-serif;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            transition: 0.2s ease;
        }

        .back-button:hover {
            background: #245300;
            color: #ffffff;
            transform: translateX(-2px);
        }
    </style>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/chat.css">
</head>

<body>
    <header>
        <nav class="navbar">
            <a href="dashboard.html" class="logo">FoundU</a>
            <div class="nav-links">
                <a href="dashboard.html" data-i18n="home">Home</a>
                <a href="search.html" data-i18n="search">Search</a>
                <a href="profile.html" data-i18n="profile">Profile</a>
            </div>
        </nav>
    </header>

    <main class="chat-list-page">

        <!--Back button-->
        <div class="back-button-container">

            <a href="dashboard.html" class="back-button">

                ←
                <span data-i18n="back">
                    Back
                </span>

            </a>

        </div>
        <section class="chat-list-container">
            <h1 data-i18n="messages">Messages</h1>
            <p class="page-description" data-i18n="messagesDescription">Chat directly with other FoundU users. No email
                is needed.</p>
            <div id="chat-list">
                <p class="form-message" data-i18n="loadingMessages">Loading messages...</p>
            </div>
        </section>
    </main>

    <nav class="bottom-nav">
        <a href="dashboard.html" data-i18n="home">Home</a>
        <a href="search.html" data-i18n="search">Search</a>
        <a href="chats.html" class="active" data-i18n="messages">Messages</a>
        <a href="profile.html" data-i18n="profile">Profile</a>
    </nav>

    <script src="js/scripts.js"></script>
    <script type="module" src="js/chats.js"></script>
    <script src="js/language.js"></script>
    <script src="js/pwa.js"></script>
</body>

</html>
