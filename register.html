<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#245300">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="images/icon-192.png">
    <title>FoundU - Register</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">

</head>

<body>

    <main class="auth-page">
        <div class="auth-container">
            <!-- Back -->
            <a href="index.html" class="back-link" data-i18n="back">
                Back
            </a>

            <!-- Hero Graphic Area -->
            <section class="hero-section">
                <div class="hero-content">
                    <!-- Logo & Text Left -->
                    <div class="brand-header">
                        <!-- <div class="brand-logo">
                            <i class="fa-solid fa-location-dot logo-icon"></i>
                        </div> -->
                        <div class="brand-title">
                            <div class="brand-wrapper">
                            <img src="images/logo.png" alt="Found You Logo" class="brand-logo">
                        </div>

                            <!-- <span class="sub-heading">KASEM BUNDIT UNIVERSITY</span>
                            <h1>Found <span class="highlight">You</span></h1>
                            <p class="tagline">discover <span class="dot">&rsaquo;</span> connect</p>
                            <div class="green-line"></div> -->
                        </div>
                    </div>

                    <!-- Building Photo Right with Diagonal Cut -->
                    <div class="building-wrapper">
                        <img src="images/kbu building.png" alt="Kasem Bundit University Building" class="building-img">
                    </div>
                </div>
            </section>


            <!-- Logo
            <div class="auth-logo">
                FoundU
            </div> -->

            <!-- Header -->
            <div class="auth-header">
                <h1 data-i18n="createAccount">
                    Create Account
                </h1>

                <p data-i18n="registerDescription">
                    Join your compus lost & found community
                </p>
            </div>

            <!-- Social Register -->
            <div class="social-login">

                <button type="button" class="social-btn google-btn" id="google-register">
                    <span class="social-icon google-icon">G</span>
                    <span>Continue with Google</span>
                </button>

            </div>

            <!-- Divider -->
            <div class="auth-divider">
                <span>OR</span>
            </div>

            <!-- Register Form -->
            <form class="auth-form" id="register-form">

                <!-- Full Name -->
                <div class="form-group">

                    <label for="name" data-i18n="fullName">
                        Full Name
                    </label>

                    <div class="input-wrapper">

                        <input type="text" id="name" name="name" placeholder="Enter your full name"
                            data-i18n-placeholder="enterFullName" autocomplete="name" required>

                    </div>

                </div>

                <!-- Student ID -->
                <div class="form-group">

                    <label for="student-id" data-i18n="studentId">
                        Student ID
                    </label>

                    <div class="input-wrapper">

                        <input type="text" id="student-id" name="student-id" placeholder="Enter your student ID"
                            data-i18n-placeholder="enterStudentId" required>

                    </div>

                </div>

                <!-- Email -->
                <div class="form-group">

                    <label for="register-email" data-i18n="email">
                        Email
                    </label>

                    <div class="input-wrapper">

                        <input type="email" id="register-email" name="email" placeholder="Enter your email"
                            data-i18n-placeholder="enterEmail" autocomplete="email" required>

                    </div>

                </div>

                <!-- Password -->
                <div class="form-group">

                    <label for="register-password" data-i18n="password">
                        Password
                    </label>

                    <div class="input-wrapper">

                        <input type="password" id="register-password" name="password" placeholder="Create a password"
                            data-i18n-placeholder="createPassword" minlength="6" autocomplete="new-password" required>

                        <button type="button" class="password-toggle" id="toggle-register-password">
                        </button>

                    </div>

                    <div class="password-strength" id="password-strength"></div>

                </div>

                <!-- Confirm Password -->
                <div class="form-group">

                    <label for="confirm-password" data-i18n="confirmPassword">
                        Confirm Password
                    </label>

                    <div class="input-wrapper">

                        <input type="password" id="confirm-password" name="confirm-password"
                            placeholder="Confirm your password" data-i18n-placeholder="confirmYourPassword"
                            minlength="6" autocomplete="new-password" required>

                        <button type="button" class="password-toggle" id="toggle-confirm-password">

                        </button>

                    </div>

                </div>

                <!-- Error / Success Message -->
                <div id="register-message" class="auth-message"></div>

                <!-- Register Button -->
                <button type="submit" class="btn primary-btn auth-btn" id="register-btn" data-i18n="createAccount">
                    Create Account
                </button>

            </form>

            <!-- Login Link-->
            <p class="auth-footer">
                <span data-i18n="alreadyHaveAccount">
                    Already have an account?
                </span>
                <a href="login.html" data-i18n="login">
                    Login
                </a>
            </p>
        </div>
    </main>
    <script src="js/scripts.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/guest-guard.js"></script>
    <script src="js/language.js"></script>
    <script src="js/pwa.js"></script>
</body>

</html>
